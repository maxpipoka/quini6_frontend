<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión - Quini 6 Estadísticas</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.6;
        color: #1f2937;
        background-color: #f9fafb;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .container {
        max-width: 400px;
        width: 100%;
        text-align: center;
        background: white;
        border-radius: 12px;
        padding: 2.5rem 1.5rem;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -2px rgba(0, 0, 0, 0.1);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        color: #9ca3af;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #111827;
        margin-bottom: 0.75rem;
      }
      p {
        color: #6b7280;
        margin-bottom: 1.5rem;
        font-size: 1rem;
      }
      .btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background-color: #3b82f6;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
        font-size: 1rem;
        transition: background-color 0.2s ease;
      }
      .btn:hover {
        background-color: #2563eb;
      }
      .btn:focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
      }
      .retry {
        margin-top: 1rem;
        display: block;
        color: #6b7280;
        text-decoration: none;
        font-size: 0.875rem;
      }
      .retry:hover {
        color: #3b82f6;
      }
      .retry:focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"
        />
      </svg>
      <h1>Sin conexión</h1>
      <p>
        No tienes conexión a internet en este momento. Esta página no está disponible sin conexión
        porque no la has visitado antes.
      </p>
      <a href="/" class="btn">Volver al inicio</a>
      <a
        href="#"
        class="retry"
        onclick="
          window.location.reload();
          return false;
        "
        >Reintentar</a
      >
    </div>
  </body>
</html>
